openapi: 3.0.3
info:
  title: 'Sample API'
  version: v1
servers:
  - url: "/api/v1"

tags:
  - name: orders
    description: Endpoints to manage orders

paths:
  /orders:
    post:
      tags:
        - orders
      summary: Register a new order
      operationId: registerOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOrder'
      responses:
        '200':
          description: Order registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterOrderResponse'
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '422':
          description: |
            An error occurred
            
            Problem details error type is one of:
              - `tag:example.com,2025:problems:sample-api/orders/unknown-dishes`, includes `UnknownDishesErrorDetail` as `objectDetail`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /orders/{orderId}:
    get:
      tags:
        - orders
      summary: Fetches an order details given its id
      operationId: getOrderDetails
      parameters:
        - name: orderId
          in: path
          description: The id of the order
          required: true
          schema:
            type: string
            format: uuid
            example: a59dfdab-4abc-4de9-afd6-81e45513d484
      responses:
        '200':
          description: The order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetails'
        '400':
          description: |
            Invalid request
            
            Problem details error type is `tag:example.com,2025:problems:sample-api/general/validation-error`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: |
            Order not found
            
            Problem details error type is `tag:example.com,2025:problems:sample-api/general/not-found-error`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /orders/{orderId}/cancel:
    post:
      tags:
        - orders
      summary: Cancel an order
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          description: The id of the order
          required: true
          schema:
            type: string
            format: uuid
            example: a59dfdab-4abc-4de9-afd6-81e45513d484
      responses:
        '204':
          description: Order cancelled successfully
        '400':
          description: |
            Invalid request
            
            Problem details error type is `tag:example.com,2025:problems:sample-api/general/validation-error`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '404':
          description: |
            Order not found
            
            Problem details error type is `tag:example.com,2025:problems:sample-api/general/not-found-error`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: |
            An error occurred
            
            Problem details error type is one of:
              - `tag:example.com,2025:problems:sample-api/orders/order-no-longer-cancellable`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    OrderItem:
      type: object
      description: Defines a single line in an order
      required:
        - dishId
        - quantity
      properties:
        dishId:
          type: string
          format: uuid
          example: a59dfdab-4abc-4de9-afd6-81e45513d484
          description: The id of the dish being ordered
        quantity:
          type: integer
          example: 2
          description: The quantity of the dish being ordered

    RegisterOrder:
      type: object
      description: Defines the details of an order to be registered
      required:
        - dishes
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          description: A collection of order items, each representing a dish and its quantity

    RegisterOrderResponse:
      type: object
      description: The response returned when an order is registered successfully
      required:
        - id
      properties:
        id:
          type: string
          format: uuid
          example: a59dfdab-4abc-4de9-afd6-81e45513d484
          description: The id of the registered order

    OrderDetails:
      type: object
      description: Defines the details of an order
      required:
        - id
        - items
        - status
      properties:
        id:
          type: string
          format: uuid
          example: a59dfdab-4abc-4de9-afd6-81e45513d484
          description: The id of the order
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          description: A collection of order items
        status:
          type: string
          enum:
            - registered
            - inPreparation
            - waitingForCourier
            - outForDelivery
            - completed
            - cancelled
          description: The current status of the order

    ProblemDetails:
      description: A tailored problem details schema, respecting the RFC `https://www.rfc-editor.org/rfc/rfc9457`
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          description: |
            A URI identifying the problem type.
            
            Possible values:
              - `tag:example.com,2025:problems:sample-api/accounts/already-exists-error`
              - `tag:example.com,2025:problems:sample-api/general/not-found-error`
              - `tag:example.com,2025:problems:sample-api/orders/unknown-dishes`, includes `UnknownDishesErrorDetail` as `objectDetail`
              - `tag:example.com,2025:problems:sample-api/orders/order-no-longer-cancellable`
        title:
          type: string
          description: A short, human-readable summary of the problem (not localized).
        status:
          type: integer
          description: The HTTP status code for the request with the problem.
        detail:
          type: string
          nullable: true
          description: A human-readable explanation specific to this occurrence of the problem (not localized).
        traceId:
          type: string
          nullable: true
          description: The id of the trace associated with the request where the problem occurred.
        objectDetail:
          type: object
          nullable: true
          description: |
            An (optional) object containing more specific information about the error.

            Its structure depends on the `type` property, and can be found listed in this document.

    ValidationProblemDetails:
      description: A tailored problem details schema, respecting the RFC `https://www.rfc-editor.org/rfc/rfc9457`
      type: object
      required:
        - type
        - title
        - status
        - errors
      properties:
        type:
          type: string
          description: |
            A URI identifying the problem type.
            
            Possible values:
              - `tag:example.com,2025:problems:sample-api/general/validation-error
        title:
          type: string
          description: A short, human-readable summary of the problem (not localized).
        status:
          type: integer
          description: The HTTP status code for the request with the problem.
        detail:
          type: string
          nullable: true
          description: A human-readable explanation specific to this occurrence of the problem (not localized).
        traceId:
          type: string
          nullable: true
          description: The id of the trace associated with the request where the problem occurred.
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
          description: A collection of validation errors.
    ValidationError:
      type: object
      description: |
        Includes details about validation errors.

        Only one of the properties `parameter`, `header` and `pointer` is present, depending on the origin (check property descriptions for more info).
      required:
        - description
      properties:
        description:
          type: string
          description: Non-localized description of the error.
        parameter:
          type: string
          nullable: true
          description: Included to identify a path or query parameter that is invalid.
        header:
          type: string
          nullable: true
          description: Included to identify a header parameter that is invalid.
        pointer:
          type: string
          nullable: true
          description: |
            Included to identify a property of a JSON payload that is invalid.

            JSON Pointer to the property that caused the error, following RFC `https://www.rfc-editor.org/rfc/rfc6901`, in its URI Fragment Identifier Representation.
    UnknownDishesErrorDetail:
      type: object
      required:
        - dishIds
      properties:
        dishIds:
          type: array
          items:
            type: string
            format: uuid
            example: a59dfdab-4abc-4de9-afd6-81e45513d484
          description: A collection of dish ids that were not found in the system
  securitySchemes:
    BearerAuthentication:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - BearerAuthentication: [ ]